# Server
server.port=8080
spring.application.name=devflow-backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/devflow
spring.datasource.username=om
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=devflow-super-secret-jwt-key-2024-hackathon-minimum-256-bits-long-string
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=./uploads

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Logging
logging.level.com.devflow=DEBUG
logging.level.org.springframework.security=WARN
